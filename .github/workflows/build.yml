name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restore
        run: dotnet restore FocusHeure.csproj

      - name: Build
        run: dotnet build FocusHeure.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/FocusHeure.Tests.csproj --configuration Release

      - name: Publish portable executable
        run: dotnet publish FocusHeure.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusHeure-win-x64
          path: artifacts/FocusHeure.exe
